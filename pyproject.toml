[project]
name = "saitan-ai"
version = "0.1.0"
description = "Evidence-first competition discovery with a local browser agent"
requires-python = ">=3.12,<3.13"
dependencies = [
  "browser-use==0.13.11", "fastapi>=0.115,<1", "uvicorn>=0.34,<1",
  "sqlalchemy>=2.0,<3", "pydantic-settings>=2.7,<3", "httpx>=0.28,<1",
  "beautifulsoup4>=4.13,<5", "cryptography>=44", "tzdata>=2025.1"
]
[dependency-groups]
dev = ["pytest>=8,<10", "pytest-asyncio>=0.25,<2"]
[tool.pytest.ini_options]
pythonpath = ["."]
asyncio_mode = "auto"
testpaths = ["tests"]
